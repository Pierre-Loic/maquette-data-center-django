{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Django App{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'dashboard/css/main.css' %}">
</head>


<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<header class="py-2" style="background-color: var(--miai-blue, #f00);">
  <div class="container d-flex align-items-center gap-3">

    <!-- Logo -->
    <a href="/" class="d-inline-flex align-items-center text-decoration-none">
      <img src="{% static 'dashboard/images/miai.png' %}" alt="Logo Miai" height="45">
    </a>

    <!-- Title -->
    <span class="fs-5 fw-semibold text-white flex-grow-1 text-truncate">
      <a class="nav-link text-white px-2 py-1" href="{% url 'fonctionnement' %}">Plateforme pédagogique sur l'IA générative</a>
    </span>

    <!-- Nav (sur la même ligne) -->
    <nav class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
      <a class="nav-link text-white px-2 py-1" href="{% url 'fonctionnement' %}">Fonctionnement</a>
      <a class="nav-link text-white px-2 py-1" href="{% url 'game' %}">Jeu températures</a>
      <a class="nav-link text-white px-2 py-1" href="{% url 'classement' %}">Classement du jeu</a>
      <a class="nav-link text-white px-2 py-1" href="{% url 'dialogue' %}">Dialogue IA</a>
    </nav>

  </div>
</header>

<!-- MAIN CONTENT -->
<main class="flex-grow-1 d-flex">
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
</main>

<!-- FOOTER -->
<footer class="mt-auto py-3" style="background-color: #f8f9fa;">
    <div class="container text-center text-muted small">
        <span style="color: var(--miai-gray);">
           © 2026 – MIAI EFELIA - Pierre-Loïc Bayart
        </span>
    </div>
</footer>

<!-- Bootstrap JS -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
